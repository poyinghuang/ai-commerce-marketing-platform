name: CI

on:
  push:
    branches: [main, codex/stage-01-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21.0.9+10
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Normalize executable scripts
        run: chmod +x backend/mvnw scripts/*.sh

      - name: Test Backend with PostgreSQL Testcontainers
        working-directory: backend
        run: ./mvnw --batch-mode test

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend dependencies
        working-directory: frontend
        run: |
          test "$(npm --version)" = "11.16.0"
          npm ci

      - name: Verify Frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm audit --omit=dev

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Start and wait for the full stack
        run: docker compose up --detach --build --wait --wait-timeout 180

      - name: Smoke test health chain
        run: |
          test "$(curl --fail --silent http://localhost:8080/actuator/health)" = '{"status":"UP"}'
          test "$(curl --fail --silent http://localhost:3000/api/backend-health)" = '{"status":"UP"}'

      - name: Stop the full stack
        if: always()
        run: docker compose down --volumes

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full repository history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Scan with Gitleaks 8.28.0
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            detect --source=/repo --redact --no-banner
          docker run --rm \
            --volume "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            dir /repo --redact --no-banner
