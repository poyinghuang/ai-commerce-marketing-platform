name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate GitHub Actions workflow
        run: |
          curl --fail --silent --show-error --location \
            --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  actionlint.tar.gz' \
            | sha256sum --check
          tar --extract --gzip --file actionlint.tar.gz actionlint
          ./actionlint

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21.0.9+10.0.LTS"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Normalize executable scripts
        run: chmod +x backend/mvnw scripts/*.sh

      - name: Test Backend with PostgreSQL Testcontainers
        working-directory: backend
        run: ./mvnw --batch-mode test

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend dependencies
        working-directory: frontend
        run: |
          test "$(npm --version)" = "11.16.0"
          npm ci

      - name: Verify Frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm audit --omit=dev

      - name: Install pinned Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Start and wait for the full stack
        env:
          AI_BUDGET_CURRENCY: USD
          AI_MAX_JOB_COST: "5.000000"
          AI_MAX_BATCH_COST: "20.000000"
          AI_MAX_DAILY_COST: "100.000000"
        run: docker compose up --detach --build --wait --wait-timeout 180

      - name: Run Browser E2E
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_AUDIT_DB_ASSERTION: "1"
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v7.0.1
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Smoke test health chain and product vertical slice
        run: |
          test "$(curl --fail --silent http://localhost:8080/actuator/health)" = '{"status":"UP"}'
          test "$(curl --fail --silent http://localhost:3000/api/backend-health)" = '{"status":"UP"}'
          create_headers="$(mktemp)"
          create_body="$(mktemp)"
          curl --fail --silent --show-error \
            --dump-header "$create_headers" \
            --output "$create_body" \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"sku":"CI-SKU","productName":"CI Product","salePrice":"20.0000","currency":"TWD","stock":"5"}' \
            http://localhost:3000/api/products
          product_uuid="$(jq --raw-output '.productUuid' "$create_body")"
          test "$product_uuid" != "null"
          create_etag="$(tr -d '\r' < "$create_headers" | awk 'tolower($1) == "etag:" { print $2 }' | tail -1)"
          test -n "$create_etag"
          test "$(curl --fail --silent "http://localhost:3000/api/products/$product_uuid" | jq --raw-output '.productName')" = 'CI Product'

          patch_headers="$(mktemp)"
          curl --fail --silent --show-error \
            --dump-header "$patch_headers" \
            --output /dev/null \
            --request PATCH \
            --header "If-Match: $create_etag" \
            --header 'Content-Type: application/merge-patch+json' \
            --data '{"brand":"CI Brand"}' \
            "http://localhost:3000/api/products/$product_uuid"
          patch_etag="$(tr -d '\r' < "$patch_headers" | awk 'tolower($1) == "etag:" { print $2 }' | tail -1)"
          test -n "$patch_etag"

          archive_headers="$(mktemp)"
          curl --fail --silent --show-error \
            --dump-header "$archive_headers" \
            --output /dev/null \
            --request DELETE \
            --header "If-Match: $patch_etag" \
            "http://localhost:3000/api/products/$product_uuid"
          archive_etag="$(tr -d '\r' < "$archive_headers" | awk 'tolower($1) == "etag:" { print $2 }' | tail -1)"
          test -n "$archive_etag"

          test "$(curl --fail --silent --request POST --header "If-Match: $archive_etag" \
            "http://localhost:3000/api/products/$product_uuid/restore" | jq --raw-output '.lifecycleStatus')" = 'ACTIVE'

      - name: Stop the full stack
        if: always()
        run: docker compose down --volumes

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full repository history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Scan with Gitleaks 8.28.0
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            detect --source=/repo --redact --no-banner
          docker run --rm \
            --volume "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            dir /repo --redact --no-banner
