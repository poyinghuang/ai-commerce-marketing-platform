spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ai_commerce}
    username: ${DATABASE_USERNAME:ai_commerce}
    password: ${DATABASE_PASSWORD:ai_commerce_local}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    parser:
      strict-duplicate-detection: true

app:
  quality:
    startup-repair-enabled: true
platform:
  adapter: fake
  image:
    provider: stub
  web:
    enabled: true
  stage4b:
    enabled: true
  stage4c:
    enabled: true
  stage4d:
    enabled: true
  stage5:
    enabled: true
  stage6:
    enabled: true
