spring:
  application:
    name: ai-commerce-marketing-platform-backend
  datasource:
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
      initialization-fail-timeout: -1
  flyway:
    clean-disabled: true
    connect-retries: 10
    connect-retries-interval: 5s
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      discovery:
        enabled: false
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: false
      show-details: never
      show-components: never

logging:
  structured:
    format:
      console: ecs

app:
  quality:
    startup-repair-enabled: false
