services:
  postgres:
    image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_commerce}
      POSTGRES_USER: ${POSTGRES_USER:-ai_commerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_commerce_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    image: ai-commerce-marketing-platform-backend:0.1.0
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ai_commerce}
      DATABASE_USERNAME: ${POSTGRES_USER:-ai_commerce}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-ai_commerce_local}
      AI_BUDGET_CURRENCY: ${AI_BUDGET_CURRENCY:-}
      AI_MAX_JOB_COST: ${AI_MAX_JOB_COST:-}
      AI_MAX_BATCH_COST: ${AI_MAX_BATCH_COST:-}
      AI_MAX_DAILY_COST: ${AI_MAX_DAILY_COST:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 45s
    restart: on-failure:3

  frontend:
    image: ai-commerce-marketing-platform-frontend:0.1.0
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8080}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/backend-health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: on-failure:3

volumes:
  postgres_data:
